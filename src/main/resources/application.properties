# API Gateway Config
server.port=8050
spring.application.name=api-gateway

# EUREKA CONFIGURATION
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.client.service-url.defaultZone=http://localhost:8010/eureka

# SPRING GATEWAY CONFIGURATION
spring.main.web-application-type=reactive

# GATEWAY ROUTES
# ROUTE 0 - GET /userservice/h2-console
spring.cloud.gateway.routes[0].id=users-h2-console
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/userservice/h2-console
spring.cloud.gateway.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/userservice/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Cookie

# ROUTE 1 - POST /userservice/login
spring.cloud.gateway.routes[1].id=users-login
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/userservice/users/login
spring.cloud.gateway.routes[1].predicates[1]=Method=POST
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/userservice/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[1].filters[1]=RemoveRequestHeader=Cookie

# ROUTE 2 - GET /userservice/users/status (with Authorization header)
spring.cloud.gateway.routes[2].id=users-status
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/userservice/users/status
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.routes[2].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/userservice/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[2].filters[1]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[2].filters[2]=AuthorizationHeaderFilter

# ROUTE 3 - POST /userservice/users (create user)
spring.cloud.gateway.routes[3].id=users-create
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/userservice/users
spring.cloud.gateway.routes[3].predicates[1]=Method=POST
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/userservice/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[3].filters[1]=RemoveRequestHeader=Cookie

spring.config.import=optional:configserver:http://localhost:8020
spring.cloud.config.enabled=true